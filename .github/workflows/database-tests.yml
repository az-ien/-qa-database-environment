name: Database Tests

on:
  # A merge into main is delivered as a push, including squash and rebase merges.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  database-tests:
    name: PostgreSQL Python and Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qa_test
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: qa_test
      DB_USER: qa_user
      DB_PASSWORD: qa_password
      PGPASSWORD: qa_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Create tables
        run: |
          set -euo pipefail
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -f sql/schema.sql

      - name: Insert four dummy users
        run: |
          set -euo pipefail
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -f sql/seed.sql

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-tests/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r python-tests/requirements.txt

      - name: Run Python database tests
        id: python-tests
        continue-on-error: true
        working-directory: python-tests
        run: |
          mkdir -p reports
          pytest --junitxml=reports/pytest-results.xml --html=reports/report.html --self-contained-html

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java-tests/pom.xml

      - name: Run Java database tests
        id: java-tests
        continue-on-error: true
        working-directory: java-tests
        run: mvn -B test

      - name: Upload Python HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-html-report
          path: python-tests/reports/

      - name: Upload TestNG emailable report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emailable-report
          path: java-tests/target/surefire-reports/emailable-report.html

      - name: Fail the workflow when a test suite fails
        if: always() && (steps.python-tests.outcome == 'failure' || steps.java-tests.outcome == 'failure')
        run: |
          echo "Python tests outcome: ${{ steps.python-tests.outcome }}"
          echo "Java tests outcome: ${{ steps.java-tests.outcome }}"
          exit 1
